# Keeps the SHA-pinned actions current: the repository requires every action
# to be pinned to a full commit SHA, and a pin nobody updates goes stale. One
# grouped PR a month, titled as a Conventional Commit (`ci: …`) so it passes
# pr-title.yml and lands in the changelog's hidden CI section.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
