# The self-contained test set: everything that needs nothing beyond Node,
# Chrome, and workerd. The suites that stay local — and why — are tabled in
# README.md § Testing (ingestion needs a running preview worker, the validator
# needs Docker pre-flight, Safari VP9-alpha needs real Safari, fonts:library
# needs a real library store). The seven `:deployed` gates run on deploy day
# only: they provision real Events in production and spend Ably free-plan
# quota (#189).
#
# When it runs, and why no more often:
#
#   - PRs only, never on push to main. Every change reaches main as a squash
#     merge of a PR whose run was green (AGENTS.md), and deploys ship released
#     tags, so re-running the same gates on the merge commit doubled Actions
#     spend for no added signal.
#   - Not on draft PRs. `pnpm verify` is the gate while a branch is in
#     progress; marking the PR ready for review runs CI.
#   - Not when a PR changes only docs or workflows that are not this one.
#   - A newer push cancels the run it supersedes.
#
# Safe while main has no required status checks, which a private repository on
# the Free plan cannot have (see README.md § Releases).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - .github/dependabot.yml
      - .github/workflows/deploy.yml
      - .github/workflows/pr-title.yml
      - .github/workflows/release-please.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node's default ~2GB old-space cap is too small on hosted runners for the
# Nuxt/Vite build, whole-repo eslint, and vue-tsc alike.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Every suite `pnpm test` runs appears below as its own `pnpm <script>` step
  # (test/unit/scripts/workerSmoke.test.ts holds that), split across parallel
  # jobs so the longest one, not the sum, sets the wall time. Each extra job
  # costs a checkout and install (~1 runner-minute); the split is worth that
  # and no finer.
  checks:
    name: Lint, typecheck, unit and Nuxt suites
    if: ${{ !github.event.pull_request.draft }}
    # Pinned rather than `ubuntu-latest`, so an image change (Chrome, system
    # libraries the browser gates depend on) is a reviewed edit, not a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Cheap gates first so they fail fast. Neither cache is restored: a cold
      # run is the backstop for what the local per-file ESLint cache can miss
      # (README § Testing).
      - run: pnpm lint
      - run: pnpm typecheck
      # With --coverage, so the thresholds in vitest.shared.ts fail these steps
      # when coverage drops below them (#469).
      - run: pnpm test:unit:coverage
      - run: pnpm test:nuxt:coverage

  integration:
    name: Integration suite (${{ matrix.shard }}/2)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Each shard starts its own servers over its own databases, so the halves
      # share nothing. Realtime tests self-skip: no Ably key is configured in CI
      # by decision; realtime coverage runs locally (#189).
      - run: pnpm test:integration:run --shard=${{ matrix.shard }}/2

  server-and-browser:
    name: Local-auth suite and browser gates
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:local-auth:run
      - run: pnpm test:browser:still-images
      - run: pnpm test:browser:silent-video
      - run: pnpm test:browser:fonts
      - run: pnpm test:browser:animation-effects

  worker-guard:
    name: Build, wrangler dry run, and Worker smoke
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base: enough to diff.
          fetch-depth: 2
      # A PR touching only tests or docs cannot change the uploaded bundle, so
      # building it again would prove what main already proved.
      - name: Decide whether the Worker bundle can have changed
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(test/|\.vscode/)|\.md$'; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only tests or docs changed; the Worker bundle is the base branch's."
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.bundle == 'true'
        uses: ./.github/actions/setup
      # The #302 class of failure: green on Node, broken on workerd. The dry
      # run asserts the bundle wrangler would upload compiles no Wasm from
      # bytes, so it belongs on every PR — not just deploy day.
      - if: steps.scope.outputs.bundle == 'true'
        run: pnpm build
      - if: steps.scope.outputs.bundle == 'true'
        run: pnpm worker:dry-run
      # Starts that same artifact under production-shaped local workerd and
      # sends the small runtime/bindings/auth/streaming probe set through it.
      - if: steps.scope.outputs.bundle == 'true'
        run: pnpm worker:smoke
