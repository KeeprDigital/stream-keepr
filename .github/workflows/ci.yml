# The self-contained test set: everything that needs nothing beyond Node,
# Chrome, and workerd. The suites that stay local — and why — are tabled in
# README.md § Testing (ingestion needs a running preview worker, the validator
# needs Docker pre-flight, fonts:library needs a real library store). The six
# `pnpm accept deployed` gates run on deploy day only: they provision real
# Events in production and spend Ably free-plan quota (#189).
#
# When it runs, and why no more often (ADR-0036):
#
#   - In the merge queue (`merge_group`): the run that decides what lands. It
#     tests the group's head, the exact combined tree main moves to, so two
#     PRs that each passed against an old main cannot land an untested
#     combination. main then fast-forwards to that commit, and release-please
#     tags only a commit that passed here (scripts/release-gate.mjs).
#   - On PRs, for feedback and because the queue admits only a PR whose
#     required checks passed. Not on push to main: what main moves to already
#     passed in the queue.
#   - Not on draft PRs. `pnpm verify:quick` is the gate while a branch is in
#     progress; marking the PR ready for review runs CI, the full gate, so
#     nobody runs `pnpm verify` locally just to repeat it.
#   - Only the jobs a change can affect: none for docs, no Worker build for
#     tests or the other workflows alone. The `scope` job decides, measuring a PR
#     against its base and a merge group against the queue's base
#     (scripts/ci-scope.mjs); anything it cannot measure runs everything.
#   - Not twice on the same tree. A merge group whose tree is byte-identical
#     to one a full, green PR run verified (one PR, main unchanged since that
#     run) skips every gate: the `record` job of that PR run left GitHub's
#     signed word for which commit it ran (scripts/ci-reuse.mjs). Any doubt
#     runs everything.
#   - A newer push cancels the PR run it supersedes. Every merge-group entry
#     has its own ref, so the queue's runs never cancel each other.
#
# `CI passed` is a required status check, on PRs and merge groups alike. It
# always reports, whatever was skipped, so a docs-only change is never left
# waiting on a check that cannot arrive; a workflow-level `paths-ignore` would
# do exactly that, and in the queue would hold the group until it timed out.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node's default ~2GB old-space cap is too small on hosted runners for the
# Nuxt/Vite build, whole-repo eslint, and vue-tsc alike.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  scope:
    name: Decide what the change can affect
    # A merge group carries no `pull_request`; it always runs.
    if: github.event_name == 'merge_group' || !github.event.pull_request.draft
    # Pinned rather than `ubuntu-latest`, so an image change (Chrome, system
    # libraries the browser gates depend on) is a reviewed edit, not a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # In a merge group: the PR runs' records, their jobs, and the commits
      # they name (scripts/ci-reuse.mjs).
      actions: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      bundle: ${{ steps.scope.outputs.bundle }}
      verified-by: ${{ steps.scope.outputs.verified-by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's test merge commit and its first parent, the base: enough to
          # diff. A merge group's base is further back; the script fetches it.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs

  # Every gate `pnpm test` runs (verify.mjs --tests) appears below as its own step
  # (test/unit/scripts/workerSmoke.test.ts holds that), split across parallel
  # jobs so the longest one, not the sum, sets the wall time.
  checks:
    name: Lint, typecheck, unit and Nuxt suites
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Cheap gates first so they fail fast. Neither cache is restored: a cold
      # run is the backstop for what the local per-file ESLint cache can miss
      # (README § Testing).
      - run: pnpm lint
      # Includes the silent-video validator Worker's own program (#618), and
      # fails when either committed worker-configuration.d.ts is stale.
      - run: pnpm typecheck
      # With --coverage, so the thresholds in vitest.shared.ts fail these steps
      # when coverage drops below them (#469).
      - run: pnpm test:unit:coverage
      - run: pnpm test:nuxt:coverage

  integration:
    name: Integration suite (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Each shard starts its own servers over its own databases, so the halves
      # share nothing. Realtime tests self-skip: no Ably key is configured in CI
      # by decision; realtime coverage runs locally (#189).
      - run: pnpm test:integration --run --shard=${{ matrix.shard }}/2

  server-and-browser:
    name: Local-auth suite and browser gates
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:local-auth
      - run: pnpm accept still-images
      - run: pnpm accept silent-video
      - run: pnpm accept fonts
      - run: pnpm accept animation-effects
      - run: pnpm accept key-matte

  worker-guard:
    name: Build, wrangler dry runs, and Worker smoke
    needs: scope
    # A change touching only tests, docs or the other workflows cannot change
    # the uploaded bundle, so building it again would prove what main already
    # proved.
    if: needs.scope.outputs.bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The silent-video validator is a second deployed Worker (#618), bundled
      # by wrangler exactly as `pnpm deploy:validator` would. About a second,
      # and first so a broken import fails before the app build starts.
      # `--containers-rollout=none` keeps it to the bundle: no Docker build, no
      # credentials.
      - run: pnpm validator:dry-run
      # The #302 class of failure: green on Node, broken on workerd. The dry
      # run asserts the bundle wrangler would upload compiles no Wasm from
      # bytes, so it belongs on every PR — not just deploy day.
      - run: pnpm build
      - run: pnpm worker:dry-run
      # Starts that same artifact under production-shaped local workerd and
      # sends the small runtime/bindings/auth/streaming probe set through it.
      - run: pnpm worker:smoke

  # A PR run that ran every gate and passed leaves a record of the tree it
  # verified, so its merge group can skip running them again on exactly that
  # tree (scripts/ci-reuse.mjs). The record is an OIDC token GitHub signs for
  # this job, naming the commit the run executed; the job's own code chooses
  # only the artifact's name, which nothing trusts. A fork's PR gets no token:
  # its group runs everything. Recording never fails `CI passed`; without a
  # record the group runs everything.
  record:
    name: Record the verified tree
    needs: [scope, checks, integration, server-and-browser, worker-guard]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.scope.outputs.code == 'true'
      && needs.scope.outputs.bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci-reuse.mjs
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - id: record
        run: node scripts/ci-reuse.mjs record
      - if: steps.record.outputs.name != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ steps.record.outputs.path }}
          retention-days: 30
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [scope, checks, integration, server-and-browser, worker-guard, record]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Skipped is fine: `scope` decided the job had nothing to prove, because
      # the change cannot affect it or, in a merge group, because a full green
      # PR run already proved it on exactly this tree (VERIFIED_BY names it).
      # Failed or cancelled is not. A draft PR skips everything and passes
      # here, which is harmless: a draft cannot be queued, and marking it ready
      # runs CI again. `record` proves nothing, so it only warns: it is waited
      # for so its artifact exists before the PR can be queued, and a failed
      # record costs the merge group a full run, never the PR its check.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          VERIFIED_BY: ${{ needs.scope.outputs.verified-by }}
        run: |
          if [ -n "$VERIFIED_BY" ]; then
            echo "This tree is exactly the one $VERIFIED_BY verified: its gates were not run again."
          fi
          RECORD=$(jq -r '.record.result' <<<"$NEEDS")
          case "$RECORD" in
            success|skipped) ;;
            *) echo "::warning::Recording the verified tree ended $RECORD: its merge group will run everything." ;;
          esac
          RESULTS=$(jq -r 'to_entries | map(select(.key != "record") | .value.result) | join(" ")' <<<"$NEEDS")
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended $result."; exit 1 ;;
            esac
          done
