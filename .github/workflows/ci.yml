# The self-contained test set: everything that needs nothing beyond Node,
# Chrome, and workerd. The suites that stay local — and why — are tabled in
# README.md § Testing (ingestion needs a running preview worker, the validator
# needs Docker pre-flight, Safari VP9-alpha needs real Safari, fonts:library
# needs a real library store). The seven `:deployed` gates run on deploy day
# only: they provision real Events in production and spend Ably free-plan
# quota (#189).
#
# PR-only by decision: no push-to-main trigger. Merges land squarely from
# CI-green PRs, and deploys ship released tags whose PR run was green —
# re-running the same gates on the merge commit doubled Actions spend for
# no added signal. Docs-only PRs are skipped for the same reason; safe while
# main has no required status checks (see release-please.yml).

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node's default ~2GB old-space cap is too small on hosted runners for the
# Nuxt/Vite build, whole-repo eslint, and vue-tsc alike.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  tests:
    name: Lint, typecheck, and test gates
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint and typecheck lead so the cheap gates fail fast; they share this
      # job to save a third checkout + install per run.
      - run: pnpm lint
      - run: pnpm typecheck
      # One runner, sequential tiers: this is the "one authoritative run on a
      # quiet machine" that docs/agents/parallel-rounds.md requires for
      # integration numbers. Realtime integration tests self-skip here — no
      # Ably key is configured in CI by decision; realtime coverage runs
      # locally (#189).
      - run: pnpm test

  worker-guard:
    name: Build, wrangler dry run, and Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The #302 class of failure: green on Node, broken on workerd. The dry
      # run asserts the bundle wrangler would upload compiles no Wasm from
      # bytes, so it belongs on every PR — not just deploy day.
      - run: pnpm build
      - run: pnpm worker:dry-run
      # Starts that same artifact under production-shaped local workerd and
      # sends the small runtime/bindings/auth/streaming probe set through it.
      - run: pnpm worker:smoke
