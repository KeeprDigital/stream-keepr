# Manually triggered production deploy — the Actions counterpart of running
# `pnpm deploy:validator` (when needed) and `pnpm run deploy` locally. It exists
# as an *option*, not a replacement: deploys are never merge-triggered, because
# deploy day is a human procedure (README.md § Deploy day). This workflow
# covers only what those cover — validator promotion, build, Wasm dry run,
# Worker smoke against the production-env build, D1 migration, Worker
# promotion, liveness verify. Everything after promotion stays with the
# operator:
#
#   - The six deployed acceptance gates run locally, in order, stopping at
#     the first failure (`pnpm accept deployed`). The validator pre-flight
#     needs your Docker, so they cannot run on a hosted runner.
#   - "Nothing on air" is a condition only a person can verify before
#     triggering this.
#
# Actions deploys ship released tags, never main's HEAD: the version input
# resolves through GitHub Releases (cut by merging the Release PR), so what
# promotes is always a formally released snapshot whose PRs ran CI green — and rollback
# is dispatching this workflow with the previous tag. Local `pnpm run deploy`
# stays free-form for emergencies.
#
# Each component has its own promotion marker, an annotated git tag
# (ADR-0035): `production` for the app and `production-validator` for the
# validator, each `pending` while its deploy runs and `deployed` once it is
# confirmed, so a run that fails between the two records exactly that. The
# promotion runs `scripts/deploy-promotion.mjs` from this workflow's own
# commit (main), not from the release, so rolling back to a release older
# than the markers still reads and writes them.
#
# Required `production` environment secrets (the environment deploys only
# from main): CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
# D1:Edit — plus the Containers scope whenever a run deploys the validator,
# which is a Container), CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release to deploy: a tag like v1.2.0, or "latest" for the most
          recent GitHub Release.
        required: true
        type: string
        default: latest
      d1_recovery_point:
        description: >-
          Type "confirmed" once a recent D1 Time Travel recovery point or
          export exists (README § Deploy day). D1 migration and Worker promotion
          are not one atomic transaction; this is the rollback anchor.
        required: true
        type: string
      validator:
        description: >-
          Silent-video validator promotion. auto: deploy it first unless the
          production-validator marker records a confirmed deploy with the
          target release's validator fingerprint (its bundle, Container
          context and configuration). always/never override the detection.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - always
          - never

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # write: the run force-pushes the `production` and `production-validator`
  # promotion-marker tags.
  contents: write

jobs:
  deploy:
    name: Promote the validator and the app, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://stream.keepr.digital
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The tagger identity of the annotated marker tags.
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      # nuxt build OOMs Node's default ~2GB heap on hosted runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Require the D1 recovery-point confirmation
        if: inputs.d1_recovery_point != 'confirmed'
        run: |
          echo '::error::Refusing to deploy: the d1_recovery_point input must be the word "confirmed".'
          exit 1
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs cross into the shell via env, never by expression
          # interpolation inside `run:` — this job holds the Cloudflare token.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          else
            tag="$INPUT_VERSION"
            # Fail fast on a tag that is not a published release.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > /dev/null
          fi
          echo "Deploying release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          # Full history: fetching a marker tag brings the commit it points
          # at, which a shallow clone would have to deepen to.
          fetch-depth: 0
      - name: Check out the promotion tooling from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tooling
          sparse-checkout: scripts/deploy-promotion.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Untracked files mark a checkout `dirty` in the markers; this one is
      # not part of the release.
      - run: echo /.deploy-tooling/ >> .git/info/exclude
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Decides the validator against its marker, deploys it first when that
      # says so, then runs `pnpm run deploy`, each between its markers. The
      # step summary records the decision, and on failure what each marker
      # now says (README.md § Recovering from a partial promotion).
      - name: Promote (validator when decided, then build, dry run, smoke, migrate D1, promote, verify)
        env:
          INPUT_VALIDATOR: ${{ inputs.validator }}
        run: node .deploy-tooling/scripts/deploy-promotion.mjs promote "$INPUT_VALIDATOR"
      - name: Remind the operator what is still owed
        env:
          # Step outputs derive from dispatch inputs; same env discipline as above.
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Release $RELEASE_TAG promoted; https://stream.keepr.digital answered deploy:verify (liveness only, not release identity or dependency health)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Run the six `:deployed` gates locally (`pnpm accept deployed`), in README order, stopping at the first failure.' >> "$GITHUB_STEP_SUMMARY"
