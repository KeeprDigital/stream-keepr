# Manually triggered production deploy — the Actions counterpart of running
# `pnpm deploy` locally. It exists as an *option*, not a replacement: deploys
# are never merge-triggered, because deploy day is a human procedure
# (README.md § Deploy day, in order). This workflow covers only what
# `pnpm deploy` covers — build, Wasm dry run, Worker smoke against the
# production-env build, D1 migration, Worker promotion, health verify.
# Everything after promotion stays with the operator:
#
#   - The seven `:deployed` acceptance gates run locally, in order, stopping
#     at the first failure. Two of them cannot run on a hosted runner at all
#     (Safari VP9-alpha needs real Safari; the validator pre-flight needs
#     your Docker).
#   - "Nothing on air" is a condition only a person can verify before
#     triggering this.
#
# Actions deploys ship released tags, never main's HEAD: the version input
# resolves through GitHub Releases (cut by merging the Release PR), so what
# promotes is always a formally released snapshot whose PRs ran CI green — and rollback
# is dispatching this workflow with the previous tag. Local `pnpm deploy`
# stays free-form for emergencies.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
# D1:Edit — plus the Containers scope whenever a run deploys the validator,
# which is a Container), CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release to deploy: a tag like v1.2.0, or "latest" for the most
          recent GitHub Release.
        required: true
        type: string
        default: latest
      d1_recovery_point:
        description: >-
          Type "confirmed" once a recent D1 Time Travel recovery point or
          export exists (README § Deploy). D1 migration and Worker promotion
          are not one atomic transaction; this is the rollback anchor.
        required: true
        type: string
      validator:
        description: >-
          Silent-video validator promotion. auto: deploy it first only when
          workers/silent-video-validator changed between the last successful
          production deployment and the target release. always/never override
          the detection (e.g. redeploying to recover a bad validator state,
          or skipping a first run with no deployment record).
        required: false
        type: choice
        default: auto
        options:
          - auto
          - always
          - never

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # write: a successful deploy moves the `production` git tag to the commit
  # it shipped — the authoritative deployed-state marker the validator
  # auto-detection diffs against.
  contents: write
  # Fallback for the auto-detection while no `production` tag exists yet:
  # the environment's deployment records. Less precise — a record carries
  # the dispatch-time main commit, not the deployed tag's commit.
  deployments: read

jobs:
  deploy:
    name: Build, migrate, promote, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://stream.keepr.digital
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # nuxt build OOMs Node's default ~2GB heap on hosted runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Require the D1 recovery-point confirmation
        if: inputs.d1_recovery_point != 'confirmed'
        run: |
          echo '::error::Refusing to deploy: the d1_recovery_point input must be the word "confirmed".'
          exit 1
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs cross into the shell via env, never by expression
          # interpolation inside `run:` — this job holds the Cloudflare token.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          else
            tag="$INPUT_VERSION"
            # Fail fast on a tag that is not a published release.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > /dev/null
          fi
          echo "Deploying release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          # Full history: the validator detection diffs the deployed commit
          # against the target tag.
          fetch-depth: 0
      - name: Decide whether the validator deploys
        id: validator
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VALIDATOR: ${{ inputs.validator }}
        run: |
          decide() {
            case "$INPUT_VALIDATOR" in
              always) echo "true|forced by the always input"; return ;;
              never) echo "false|suppressed by the never input"; return ;;
            esac
            # The `production` tag marks the exact commit the last successful
            # deploy shipped (moved by this workflow's final step).
            deployed_sha=$(git rev-parse -q --verify 'refs/tags/production^{commit}' || true)
            baseline="the production tag"
            if [ -z "$deployed_sha" ]; then
              # Fallback: the environment's deployment records. Imprecise —
              # a record's sha is main at dispatch time, not the deployed
              # tag's commit — but pre-tag history is better than nothing.
              # Newest-first; the first record whose latest status is success
              # is what production runs. This run's own record is still
              # in_progress, so it never matches.
              baseline="deployment records"
              for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=20" --jq '.[].id'); do
                state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
                if [ "$state" = "success" ]; then
                  deployed_sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
                  break
                fi
              done
            fi
            if [ -z "$deployed_sha" ]; then
              echo "true|no successful production deployment on record — deploying it is the safe default"
            elif ! git cat-file -e "$deployed_sha" 2> /dev/null; then
              echo "true|deployed commit $deployed_sha is unknown to this history — deploying it is the safe default"
            elif git diff --quiet "$deployed_sha" HEAD -- workers/silent-video-validator; then
              echo "false|workers/silent-video-validator unchanged since deployed $deployed_sha ($baseline)"
            else
              echo "true|workers/silent-video-validator changed since deployed $deployed_sha ($baseline)"
            fi
          }
          result=$(decide)
          deploy="${result%%|*}"
          reason="${result#*|}"
          echo "Validator deploy: $deploy ($reason)"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the silent-video validator
        if: steps.validator.outputs.deploy == 'true'
        run: pnpm deploy:validator
      - name: Deploy (build, dry run, smoke, migrate D1, promote, verify)
        run: pnpm deploy
      - name: Move the production tag to the deployed commit
        run: git push origin +HEAD:refs/tags/production
      - name: Remind the operator what is still owed
        env:
          # Step outputs derive from dispatch inputs; same env discipline as above.
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VALIDATOR_OUTCOME: ${{ steps.validator.outputs.deploy == 'true' && 'deployed' || 'not deployed' }}
          VALIDATOR_REASON: ${{ steps.validator.outputs.reason }}
        run: |
          echo "Release $RELEASE_TAG promoted and verified against https://stream.keepr.digital." >> "$GITHUB_STEP_SUMMARY"
          echo "Validator: $VALIDATOR_OUTCOME — $VALIDATOR_REASON." >> "$GITHUB_STEP_SUMMARY"
          echo 'Run the seven `:deployed` gates locally, in README order, stopping at the first failure.' >> "$GITHUB_STEP_SUMMARY"
