# Manually triggered production deploy — the Actions counterpart of running
# `pnpm deploy` locally. It exists as an *option*, not a replacement: deploys
# are never merge-triggered, because deploy day is a human procedure
# (README.md § Deploy day, in order). This workflow covers only what
# `pnpm deploy` covers — build, Wasm dry run, D1 migration, Worker promotion,
# health verify. Everything after promotion stays with the operator:
#
#   - The seven `:deployed` acceptance gates run locally, in order, stopping
#     at the first failure. Two of them cannot run on a hosted runner at all
#     (Safari VP9-alpha needs real Safari; the validator pre-flight needs
#     your Docker).
#   - "Nothing on air" is a condition only a person can verify before
#     triggering this.
#
# Actions deploys ship released tags, never main's HEAD: the version input
# resolves through GitHub Releases (cut by merging the Release PR), so what
# promotes is always a formally released, CI-green snapshot — and rollback
# is dispatching this workflow with the previous tag. Local `pnpm deploy`
# stays free-form for emergencies.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
# D1:Edit), CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release to deploy: a tag like v1.2.0, or "latest" for the most
          recent GitHub Release.
        required: true
        type: string
        default: latest
      d1_recovery_point:
        description: >-
          Type "confirmed" once a recent D1 Time Travel recovery point or
          export exists (README § Deploy). D1 migration and Worker promotion
          are not one atomic transaction; this is the rollback anchor.
        required: true
        type: string
      deploy_validator:
        description: >-
          Also deploy the silent-video validator Worker first, so the service
          binding resolves (equivalent to `pnpm deploy:validator`).
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, migrate, promote, verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://stream.keepr.digital
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # nuxt build OOMs Node's default ~2GB heap on hosted runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Require the D1 recovery-point confirmation
        if: inputs.d1_recovery_point != 'confirmed'
        run: |
          echo '::error::Refusing to deploy: the d1_recovery_point input must be the word "confirmed".'
          exit 1
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.version }}" = "latest" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          else
            tag="${{ inputs.version }}"
            # Fail fast on a tag that is not a published release.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > /dev/null
          fi
          echo "Deploying release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the silent-video validator
        if: inputs.deploy_validator
        run: pnpm deploy:validator
      - name: Deploy (build, dry run, migrate D1, promote, verify)
        run: pnpm deploy
      - name: Remind the operator what is still owed
        run: |
          echo "Release ${{ steps.release.outputs.tag }} promoted and verified against https://stream.keepr.digital." >> "$GITHUB_STEP_SUMMARY"
          echo 'Run the seven `:deployed` gates locally, in README order, stopping at the first failure.' >> "$GITHUB_STEP_SUMMARY"
