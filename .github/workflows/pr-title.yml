# PRs land as squash merges whose commit subject is the PR title, and those
# subjects are what release-please reads (README.md § Releases). A title that
# is not a Conventional Commit drops the PR from the changelog and the version
# bump without anyone noticing, so it is caught here instead
# (scripts/conventional-title.mjs).
#
# It is a required status check, so it runs wherever GitHub evaluates those:
#
#   - On every PR push and every edit. GitHub evaluates a PR's required checks
#     against its newest commit, the latest run wins, and a skipped job counts
#     as passing. Skipping body-only edits let an edit after a failing run turn
#     the check green without the title ever changing.
#   - In the merge queue (`merge_group`), where it checks the subject of every
#     squash commit the group would land: what release-please will actually
#     read, whatever the title said when the PR was queued. Without a run there
#     the queue would wait on this check until it timed out.
#
# No install: it checks out one script and reads a few strings, in seconds.

name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  # The script, and in the queue the commits between its base and the group.
  contents: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/conventional-title.mjs
            .node-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The title is contributor-controlled text: the script reads it from the
      # event payload, never through an expression in this file.
      - name: Check the title, or in the queue every commit subject it lands
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/conventional-title.mjs
