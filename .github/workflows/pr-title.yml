# PRs land as squash merges whose commit title is the PR title, and that
# commit is what release-please reads (README.md § Releases). A title that is
# not a Conventional Commit drops the PR from the changelog and the version
# bump without anyone noticing, so it is caught here instead.
#
# No checkout and no install: this reads one string, in seconds. It runs on
# every push and every edit, because it is a required status check: GitHub
# evaluates those against the PR's newest commit, the latest run wins, and a
# skipped job counts as passing. Skipping body-only edits let an edit after a
# failing run turn the check green without the title ever changing.

name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          # Via env, never interpolated into the script: the title is
          # contributor-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([^)]+\))?!?: [^ ]'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Conventional: $TITLE"
          else
            echo "::error title=PR title is not a Conventional Commit::Use 'type(scope): summary', e.g. 'fix(export): keep the canvas origin-clean'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style."
            exit 1
          fi
