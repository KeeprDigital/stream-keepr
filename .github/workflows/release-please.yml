# Maintains the rolling Release PR from conventional commits on main:
# fix → patch, feat → minor, feat!/BREAKING CHANGE → major. Merging that PR
# is the formal release act — it tags vX.Y.Z, publishes a GitHub Release
# with the changelog section, and bumps package.json's version.
#
# Only conventional commits count, which is why PRs are squash-merged with
# the PR title as the commit title and pr-title.yml checks it: a merge commit
# brings every branch commit along, and a branch merged twice (locally and by
# its PR) lists each change twice.
#
# A release is cut only from a revision the merge queue verified (ADR-0036).
# The Release PR goes through the queue like any other, so the commit
# release-please tags is the merge group's head, the exact tree CI passed on.
# The gate step refuses a merged Release PR whose commit no merge-group CI
# run passed (one merged around the queue), before anything is tagged. A
# group run that reused a PR run's verification of the byte-identical tree
# counts (ADR-0036).
#
# `workflow_dispatch` refreshes the Release PR without a push to main.
#
# Needs the repo setting Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" enabled, or
# the action cannot open its PR. The Release PR is created and updated with
# the default GITHUB_TOKEN, so GitHub creates its `pull_request` runs (CI, PR
# title) in an approval-required state (`action_required`) rather than
# starting them: that is how it stops a workflow triggering itself. A
# maintainer selects "Approve workflows to run" on the Release PR before
# queueing it (README.md § Releases). A GitHub App token passed as `token:`
# would start them without the approval.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The gate reads the merge-group CI runs on the release commit.
  actions: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/release-gate.mjs
            .node-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Refuse a release the merge queue did not verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
