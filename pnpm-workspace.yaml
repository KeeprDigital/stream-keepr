# 24h supply-chain cooldown on new releases. This matches pnpm 11's effective
# default, pinned explicitly so the gate the exclusion list below relies on
# cannot vanish with a package-manager default change (#461).
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - '@iconify-json/lucide@1.2.154'
  - better-auth@1.7.22
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0
# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
shamefullyHoist: true
shellEmulator: true
verifyDepsBeforeRun: error
engineStrict: true

# Nuxt UI installs Nuxt Fonts as a module dependency at ^0.14.0. One version
# packages the application fonts, and it is the one `package.json` pins.
overrides:
  '@nuxt/fonts': 1.2.0

patchedDependencies:
  '@scryfall/api-types@1.0.0-alpha.4': patches/@scryfall__api-types@1.0.0-alpha.4.patch

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
