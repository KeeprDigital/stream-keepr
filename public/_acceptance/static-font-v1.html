<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>static-font-v1 browser acceptance</title>
	</head>
	<body data-result="running" data-code="">
		<pre id="result">Loading representative static font faces…</pre>
		<script type="module">
			// A Screen Output must not report itself ready while a template's
			// typography is still the browser's fallback, so this page proves two
			// things about every face it is given: that it finishes loading, and
			// that what finally renders is that face rather than something that
			// merely looks like text. The pixel comparison is the only honest test
			// of the second — a face that failed to apply still produces a
			// perfectly good-looking glyph.
			//
			// With `?operation=` it also runs the real thing: a font Graphic Asset
			// staged by the harness is fetched back through the installation's own
			// routes, answered with genuine glyph proofs, published, and then
			// loaded again from the delivery route that will serve it on air.
			const parameters = new URLSearchParams(location.search);
			const operationId = parameters.get('operation');

			async function digest(bytes) {
				return Array.from(
					new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)),
					byte => byte.toString(16).padStart(2, '0'),
				).join('');
			}

			function renderContext() {
				const canvas = document.createElement('canvas');
				canvas.width = 128;
				canvas.height = 96;
				return canvas.getContext('2d', { willReadFrequently: true });
			}

			async function pixelDigest(context, fontFamily, text) {
				context.clearRect(0, 0, context.canvas.width, context.canvas.height);
				context.font = `64px ${fontFamily}`;
				context.textBaseline = 'alphabetic';
				context.fillText(text, 12, 72);
				return await digest(
					context.getImageData(0, 0, context.canvas.width, context.canvas.height).data,
				);
			}

			/**
			 * Load one face and prove every requested glyph renders from it.
			 *
			 * @returns {Promise<{
			 *   outcome: 'rendered' | 'load-failed' | 'not-applied',
			 *   reason?: string,
			 *   sourceDigest?: string,
			 *   glyphProofs?: object[],
			 * }>}
			 */
			async function verifyFace(bytes, codePoints) {
				const sourceDigest = await digest(bytes);
				const family = `sk-acceptance-${sourceDigest}`;

				let fontFace;
				try {
					fontFace = new FontFace(family, bytes);
					await fontFace.load();
				}
				catch {
					// A face the browser's font sanitiser refuses never loads, however
					// well-formed the server-side compatibility profile found it.
					return { outcome: 'load-failed', reason: 'the browser refused the face', sourceDigest };
				}
				// Readiness has to mean something. `document.fonts.check()` answers
				// true for a family nobody has heard of, so the face's own status is
				// the only signal separating "loaded" from "about to fall back".
				if (fontFace.status !== 'loaded')
					return { outcome: 'load-failed', reason: 'the face resolved without loading', sourceDigest };

				document.fonts.add(fontFace);
				try {
					const context = renderContext();
					const glyphProofs = [];
					for (const codePoint of codePoints) {
						const glyph = String.fromCodePoint(codePoint);
						await document.fonts.load(`64px "${family}"`, glyph);
						await document.fonts.ready;
						if (document.fonts.status !== 'loaded') {
							return {
								outcome: 'load-failed',
								reason: 'the document reported ready while a face was still loading',
								sourceDigest,
							};
						}
						const [
							exactWithSansDigest,
							exactWithMonoDigest,
							sansFallbackDigest,
							monoFallbackDigest,
						] = await Promise.all([
							pixelDigest(context, `"${family}", sans-serif`, glyph),
							pixelDigest(context, `"${family}", monospace`, glyph),
							pixelDigest(context, 'sans-serif', glyph),
							pixelDigest(context, 'monospace', glyph),
						]);
						// The two fallbacks must differ, or the probe cannot tell a
						// rendered face from a substituted one at all.
						if (sansFallbackDigest === monoFallbackDigest)
							return { outcome: 'not-applied', reason: 'fallbacks are indistinguishable', sourceDigest };
						if (exactWithSansDigest !== exactWithMonoDigest)
							return { outcome: 'not-applied', reason: 'the face depends on its fallback stack', sourceDigest };
						if (exactWithSansDigest === sansFallbackDigest || exactWithSansDigest === monoFallbackDigest)
							return { outcome: 'not-applied', reason: 'the fallback rendered instead of the face', sourceDigest };
						glyphProofs.push({
							codePoint,
							exactWithSansDigest,
							exactWithMonoDigest,
							sansFallbackDigest,
							monoFallbackDigest,
						});
					}
					return { outcome: 'rendered', sourceDigest, glyphProofs };
				}
				finally {
					document.fonts.delete(fontFace);
				}
			}

			async function verifyUrl(url, codePoints) {
				const response = await fetch(url, { cache: 'no-store' });
				if (!response.ok)
					return { outcome: 'load-failed', reason: `the face answered ${response.status}` };
				return await verifyFace(await response.arrayBuffer(), codePoints);
			}

			function report(code, message) {
				document.body.dataset.code = code;
				document.body.dataset.result = code === '' ? 'passed' : 'failed';
				document.querySelector('#result').textContent = message;
			}

			/**
			 * The library face: staged bytes in, published revision out, both
			 * fetched through the installation rather than from the page's own
			 * assets.
			 */
			async function runLibraryFace() {
				const operationRoute = `/api/graphics-assets/ingestion-operations/${operationId}`;
				const staged = await (await fetch(operationRoute, { cache: 'no-store' })).json();
				const challenge = staged?.report?.facts?.browserChallenge;
				if (!challenge)
					return { code: 'font-load-incomplete', message: 'The staged face offered no glyph challenge.' };

				const source = await fetch(`${operationRoute}/staged-source`, { cache: 'no-store' });
				if (!source.ok)
					return { code: 'font-load-incomplete', message: `Staged source answered ${source.status}.` };
				const verified = await verifyFace(await source.arrayBuffer(), challenge.codePoints);
				if (verified.outcome !== 'rendered') {
					return {
						code: verified.outcome === 'load-failed' ? 'font-load-incomplete' : 'font-glyph-not-rendered',
						message: `Library face: ${verified.reason}.`,
					};
				}

				const confirmed = await fetch(`${operationRoute}/font-browser-evidence`, {
					method: 'POST',
					headers: { 'content-type': 'application/json' },
					body: JSON.stringify({
						outcome: 'font-loaded',
						sourceDigest: verified.sourceDigest,
						challengeDigest: challenge.digest,
						glyphProofs: verified.glyphProofs,
					}),
				});
				if (!confirmed.ok)
					return { code: 'font-glyph-not-rendered', message: `Font evidence answered ${confirmed.status}.` };
				const published = await confirmed.json();
				if (published.stage !== 'completed' || !published.result) {
					return {
						code: 'font-load-incomplete',
						message: `The face did not publish; it reported ${published.stage}.`,
					};
				}

				// Now the part no bundled asset can prove: the published revision,
				// read back through the delivery route that serves it on air.
				const { assetId, revisionId } = published.result;
				document.body.dataset.assetId = assetId;
				const delivered = await verifyUrl(
					`/api/graphics-assets/${assetId}/revisions/${revisionId}/content`,
					challenge.codePoints.slice(0, 1),
				);
				if (delivered.outcome !== 'rendered') {
					return {
						code: delivered.outcome === 'load-failed' ? 'font-load-incomplete' : 'font-glyph-not-rendered',
						message: `Delivered face: ${delivered.reason}.`,
					};
				}
				return undefined;
			}

			try {
				const manifest = await (await fetch('static-font-v1.json', { cache: 'no-store' })).json();
				let failed;

				for (const face of manifest.faces) {
					const { outcome, reason } = await verifyUrl(face.url, [face.codePoint]);
					if (outcome === 'load-failed') {
						failed = { code: 'font-load-incomplete', message: `${face.format}: ${reason}.` };
						break;
					}
					if (outcome === 'not-applied') {
						failed = { code: 'font-glyph-not-rendered', message: `${face.format}: ${reason}.` };
						break;
					}
				}

				// A face asked for a glyph it does not contain must be caught, not
				// quietly answered by whatever the browser reaches for instead.
				if (!failed) {
					const probe = await verifyUrl(manifest.fallbackProbe.url, [manifest.fallbackProbe.codePoint]);
					if (probe.outcome === 'rendered') {
						failed = {
							code: 'font-silent-fallback-accepted',
							message: 'A face that silently fell back was accepted as rendered.',
						};
					}
				}

				if (!failed && operationId)
					failed = await runLibraryFace();

				if (failed)
					report(failed.code, failed.message);
				else {
					report(
						'',
						`${manifest.faces.map(face => face.format).join(', ')} loaded and rendered; `
						+ 'a silently substituted face was refused'
						+ (operationId ? '; a library face published and re-loaded from delivery.' : '.'),
					);
				}
			}
			catch (error) {
				report('browser-acceptance-failed', error instanceof Error ? error.message : String(error));
			}
		</script>
	</body>
</html>
