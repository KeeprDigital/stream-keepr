<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>vp9-alpha-safari-v1 browser acceptance</title>
	</head>
	<body data-result="running" data-code="" data-browserfact="" data-boundary="not-exercised">
		<pre id="result">Checking how this browser treats VP9 alpha…</pre>
		<script type="module">
			// VP9 alpha is restricted to Chromium-class Screen Outputs. The
			// restriction was originally expected to enforce itself — Safari would
			// refuse the content — but Safari 26.5 decodes it and flattens the
			// alpha away instead. It plays; it simply plays wrongly, which is worse
			// than not playing at all.
			//
			// So the guarantee cannot rest on a browser refusing anything. What is
			// enforceable is the product boundary: a Screen Output that pins
			// restricted video refuses to hand a Safari user agent a capability
			// session at all. That refusal is what this page asserts when it is
			// given a Screen Output to try (`?event=&screen=`). The raw playback
			// observation is kept as the evidence for *why* the boundary has to
			// exist, and is recorded rather than judged.
			const parameters = new URLSearchParams(location.search);
			const eventId = parameters.get('event');
			const screenId = parameters.get('screen');

			function report(code, message) {
				document.body.dataset.code = code;
				document.body.dataset.result = code === '' ? 'passed' : 'failed';
				document.querySelector('#result').textContent = message;
			}

			function blobUrl(base64, mime) {
				const binary = atob(base64);
				return URL.createObjectURL(new Blob(
					[Uint8Array.from(binary, character => character.charCodeAt(0))],
					{ type: mime },
				));
			}

			/**
			 * What this browser actually does with VP9 alpha.
			 *
			 * @returns {Promise<'refused' | 'substituted' | 'transparency-rendered' | 'undetermined'>}
			 */
			async function observeBrowserFact() {
				const { webmBase64 } = await (await fetch('vp9-alpha-v1.json', { cache: 'no-store' })).json();
				const url = blobUrl(webmBase64, 'video/webm');
				const video = document.createElement('video');
				video.muted = true;
				video.playsInline = true;
				video.preload = 'auto';
				document.body.appendChild(video);
				try {
					video.src = url;
					// "Did not decode" is not the same as "refused". A browser that
					// never got round to answering has told us nothing.
					const signal = await new Promise((resolve) => {
						video.addEventListener('loadeddata', () => resolve('decoded'), { once: true });
						video.addEventListener('error', () => resolve('refused'), { once: true });
						setTimeout(() => resolve('silent'), 8000);
					});
					if (signal === 'silent')
						return 'undetermined';
					if (signal === 'refused')
						return 'refused';
					// Weaker evidence than a refusal, and counted with it: the browser
					// accepted the container and produced no picture, so nothing of it
					// can reach air either way.
					if (video.videoWidth === 0)
						return 'refused';

					const canvas = document.createElement('canvas');
					canvas.width = video.videoWidth;
					canvas.height = video.videoHeight;
					const context = canvas.getContext('2d', { alpha: true, willReadFrequently: true });
					context.clearRect(0, 0, canvas.width, canvas.height);
					context.drawImage(video, 0, 0);
					const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
					const transparent = [...pixels].some((value, index) => index % 4 === 3 && value < 255);
					// Transparency preserved means the premise of the restriction has
					// changed and someone should look. Flattened means it played,
					// wrongly — which is exactly what the boundary keeps off air.
					return transparent ? 'transparency-rendered' : 'substituted';
				}
				finally {
					video.remove();
					URL.revokeObjectURL(url);
				}
			}

			/**
			 * The enforced guarantee: this Screen Output pins VP9-alpha video, so
			 * the capability-session bootstrap must refuse this browser outright.
			 */
			async function observeProductBoundary() {
				const minted = await fetch(
					`/api/events/${eventId}/screens/${screenId}/asset-capability`,
					{ cache: 'no-store' },
				);
				if (!minted.ok) {
					return {
						code: 'harness-precondition-unmet',
						detail: `Capability minting answered ${minted.status}.`,
					};
				}
				const { assetCapability } = await minted.json();

				const bootstrap = await fetch(
					`/api/screen-output/screens/${screenId}/asset-capability-session`,
					{ method: 'POST', headers: { authorization: `Bearer ${assetCapability}` } },
				);
				if (bootstrap.status !== 409) {
					return {
						code: 'safari-vp9-alpha-not-blocked',
						detail: `The capability session answered ${bootstrap.status} rather than refusing.`,
					};
				}
				const body = await bootstrap.json().catch(() => ({}));
				if (body?.data?.code !== 'vp9-alpha-chromium-required') {
					return {
						code: 'safari-vp9-alpha-not-blocked',
						detail: 'The refusal did not name the restricted-video reason.',
					};
				}
				return undefined;
			}

			try {
				const browserFact = await observeBrowserFact();
				document.body.dataset.browserfact = browserFact;

				let failure;
				if (eventId && screenId) {
					document.body.dataset.boundary = 'exercised';
					failure = await observeProductBoundary();
				}

				if (failure)
					report(failure.code, failure.detail);
				else if (eventId && screenId) {
					report(
						'',
						'The Screen Output refused this browser a capability session; '
						+ `left to itself the browser would have ${browserFact} the video.`,
					);
				}
				else {
					report('', `Browser fact only: this browser ${browserFact} VP9 alpha.`);
				}
			}
			catch (error) {
				report('browser-acceptance-failed', error instanceof Error ? error.message : String(error));
			}
		</script>
	</body>
</html>
