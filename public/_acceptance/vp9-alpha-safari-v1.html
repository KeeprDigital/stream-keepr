<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>vp9-alpha-safari-v1 browser acceptance</title>
	</head>
	<body data-result="running" data-code="" data-browser-fact="" data-boundary="not-exercised">
		<pre id="result">Checking how this browser treats VP9 alpha…</pre>
		<script type="module">
			// VP9 alpha is restricted to Chromium-class Screen Outputs. The
			// restriction was originally expected to enforce itself — Safari would
			// refuse the content — but Safari 26.5 decodes it and flattens the
			// alpha away instead. It plays; it simply plays wrongly, which is worse
			// than not playing at all.
			//
			// So the guarantee cannot rest on a browser refusing anything. What is
			// enforceable is the product boundary: a Screen Output never hands this
			// browser the bytes of a revision it would play wrongly. That refusal is
			// what this page asserts when it is given a Screen Output and the exact
			// restricted revision to try (`?event=&screen=&asset=&revision=`). The raw
			// playback observation is kept as the evidence for *why* the boundary has
			// to exist, and is recorded rather than judged.
			//
			// The refusal is per resolution request, not per session (#98). A session
			// refused Screen-wide cost the output every asset the Screen published and
			// left an operator with a black canvas and no reason for it, so the session
			// now opens for every browser and the restricted revision alone is refused.
			const parameters = new URLSearchParams(location.search);
			const eventId = parameters.get('event');
			const screenId = parameters.get('screen');
			const assetId = parameters.get('asset');
			const revisionId = parameters.get('revision');

			function report(code, message) {
				document.body.dataset.code = code;
				document.body.dataset.result = code === '' ? 'passed' : 'failed';
				document.querySelector('#result').textContent = message;
			}

			function blobUrl(base64, mime) {
				const binary = atob(base64);
				return URL.createObjectURL(new Blob(
					[Uint8Array.from(binary, character => character.charCodeAt(0))],
					{ type: mime },
				));
			}

			/**
			 * What this browser actually does with VP9 alpha.
			 *
			 * @returns {Promise<'refused' | 'substituted' | 'transparency-rendered' | 'undetermined'>}
			 */
			async function observeBrowserFact() {
				const { webmBase64 } = await (await fetch('vp9-alpha-v1.json', { cache: 'no-store' })).json();
				const url = blobUrl(webmBase64, 'video/webm');
				const video = document.createElement('video');
				video.muted = true;
				video.playsInline = true;
				video.preload = 'auto';
				document.body.appendChild(video);
				try {
					video.src = url;
					// "Did not decode" is not the same as "refused". A browser that
					// never got round to answering has told us nothing.
					const signal = await new Promise((resolve) => {
						video.addEventListener('loadeddata', () => resolve('decoded'), { once: true });
						video.addEventListener('error', () => resolve('refused'), { once: true });
						setTimeout(() => resolve('silent'), 8000);
					});
					if (signal === 'silent')
						return 'undetermined';
					if (signal === 'refused')
						return 'refused';
					// Weaker evidence than a refusal, and counted with it: the browser
					// accepted the container and produced no picture, so nothing of it
					// can reach air either way.
					if (video.videoWidth === 0)
						return 'refused';

					const canvas = document.createElement('canvas');
					canvas.width = video.videoWidth;
					canvas.height = video.videoHeight;
					const context = canvas.getContext('2d', { alpha: true, willReadFrequently: true });
					context.clearRect(0, 0, canvas.width, canvas.height);
					context.drawImage(video, 0, 0);
					const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
					const transparent = [...pixels].some((value, index) => index % 4 === 3 && value < 255);
					// Transparency preserved means the premise of the restriction has
					// changed and someone should look. Flattened means it played,
					// wrongly — which is exactly what the boundary keeps off air.
					return transparent ? 'transparency-rendered' : 'substituted';
				}
				finally {
					video.remove();
					URL.revokeObjectURL(url);
				}
			}

			/**
			 * The enforced guarantee: this Screen Output pins VP9-alpha video, so it
			 * must refuse this browser those exact bytes — while still opening the
			 * session every other asset on the Screen is resolved through.
			 *
			 * These two routes are spelled out rather than taken from
			 * `scripts/graphics-acceptance/routes.mjs`, which is where every other
			 * acceptance route lives. A static asset served to a browser cannot
			 * import that module, so the duplication is deliberate and this is the
			 * marker asking whoever changes those routes to change them here too.
			 */
			async function observeProductBoundary() {
				const minted = await fetch(
					`/api/events/${eventId}/screens/${screenId}/asset-capability`,
					{ cache: 'no-store' },
				);
				if (!minted.ok) {
					return {
						code: 'harness-precondition-unmet',
						detail: `Capability minting answered ${minted.status}.`,
					};
				}
				const { assetCapability } = await minted.json();

				// The session opens: losing it would cost this output every asset the
				// Screen publishes, not the one clip this browser cannot show.
				const bootstrap = await fetch(
					`/api/screen-output/screens/${screenId}/asset-capability-session`,
					{ method: 'POST', headers: { authorization: `Bearer ${assetCapability}` } },
				);
				if (bootstrap.status !== 200) {
					return {
						code: 'restricted-video-session-refused',
						detail: `The capability session answered ${bootstrap.status} rather than opening.`,
					};
				}

				// And it names the clip it is about to refuse, so the output reports the
				// reason rather than drawing a blank rectangle for bytes it never gets
				// (#184). Asserted in a real Safari because that is the engine the
				// forecast is for: everything below proves the refusal itself, and this
				// proves the output was told about it in time to say so.
				const session = await bootstrap.json().catch(() => ({}));
				const forecast = (session?.unplayableRevisions ?? []).find(
					entry => entry?.assetId === assetId && entry?.revisionId === revisionId,
				);
				if (forecast?.code !== 'vp9-alpha-chromium-required') {
					return {
						code: 'restricted-video-refusal-unforecast',
						detail: 'The capability session did not name the restricted revision it refuses.',
					};
				}

				const content = await fetch(
					`/api/screen-output/screens/${screenId}/assets/${assetId}/revisions/${revisionId}/content`,
					{ cache: 'no-store', headers: { authorization: `Bearer ${assetCapability}` } },
				);
				if (content.status !== 409) {
					return {
						code: 'safari-vp9-alpha-not-blocked',
						detail: `The restricted revision answered ${content.status} rather than refusing.`,
					};
				}
				const body = await content.json().catch(() => ({}));
				if (body?.data?.code !== 'vp9-alpha-chromium-required') {
					return {
						code: 'safari-vp9-alpha-not-blocked',
						detail: 'The refusal did not name the restricted-video reason.',
					};
				}
				return undefined;
			}

			try {
				const browserFact = await observeBrowserFact();
				document.body.dataset.browserFact = browserFact;

				let failure;
				if (eventId && screenId && assetId && revisionId) {
					document.body.dataset.boundary = 'exercised';
					failure = await observeProductBoundary();
				}

				if (failure)
					report(failure.code, failure.detail);
				else if (document.body.dataset.boundary === 'exercised') {
					report(
						'',
						'The Screen Output opened a session and refused this browser the '
						+ `restricted revision; left to itself the browser would have ${browserFact} the video.`,
					);
				}
				else {
					report('', `Browser fact only: this browser ${browserFact} VP9 alpha.`);
				}
			}
			catch (error) {
				report('browser-acceptance-failed', error instanceof Error ? error.message : String(error));
			}
		</script>
	</body>
</html>
